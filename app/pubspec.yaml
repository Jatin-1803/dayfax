name: dailyfax
description: DayFax — customer & delivery partner mobile app
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  dio: ^5.8.0+1
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  google_fonts: ^8.2.1
  intl: ^0.20.2
  equatable: ^2.0.7
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  url_launcher: ^6.3.1
  razorpay_flutter: ^1.4.6
  image_picker: ^1.1.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/branding/
