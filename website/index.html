<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DayFax — Local quick commerce</title>
    <meta
      name="description"
      content="DayFax delivers food, grocery, and essentials fast in small towns and villages across India."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">DayFax</a>
      <nav class="nav" aria-label="Legal">
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
      </nav>
    </header>

    <main class="hero">
      <div class="hero-inner">
        <p class="brand-mark">DayFax</p>
        <h1>Essentials delivered fast, close to home</h1>
        <p>
          Local quick commerce for small towns and villages — food, grocery, and
          daily needs at your door.
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-links">
          <a href="/privacy">Privacy Policy</a>
          <a href="/terms">Terms &amp; Conditions</a>
        </div>
        <p class="footer-copy">&copy; <span id="y"></span> DayFax. All rights reserved.</p>
      </div>
    </footer>
    <script>
      document.getElementById("y").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
