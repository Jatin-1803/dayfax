<input class="otp-input w-16 h-16 text-center font-headline-lg text-headline-lg bg-surface-container-low border border-outline-variant rounded-DEFAULT text-on-surface transition-all duration-200 focus:bg-surface-container-lowest" maxlength="1" type="tel" value="4"/>
<input class="otp-input w-16 h-16 text-center font-headline-lg text-headline-lg bg-surface-container-low border border-outline-variant rounded-DEFAULT text-on-surface transition-all duration-200 focus:bg-surface-container-lowest" maxlength="1" type="tel" value="2"/>
<input class="otp-input w-16 h-16 text-center font-headline-lg text-headline-lg bg-surface-container-low border border-outline-variant rounded-DEFAULT text-on-surface transition-all duration-200 focus:bg-surface-container-lowest" maxlength="1" type="tel"/>
<input class="otp-input w-16 h-16 text-center font-headline-lg text-headline-lg bg-surface-container-low border border-outline-variant rounded-DEFAULT text-on-surface transition-all duration-200 focus:bg-surface-container-lowest" maxlength="1" type="tel"/>

                </button>
</div>

                Verify &amp; Proceed
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>

</div>
<script>
        // Simple OTP auto-focus logic for demo purposes
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '') {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
        });
        
        // Focus empty input on load
        const emptyInput = Array.from(inputs).find(input => input.value === '');
        if(emptyInput) emptyInput.focus();
    </script>
