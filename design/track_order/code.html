<style>
        .map-gradient {
            background: linear-gradient(to bottom, rgba(244,251,244,0) 0%, rgba(244,251,244,1) 100%);
        }
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background h-full font-body-md antialiased overflow-x-hidden flex flex-col md:max-w-[428px] mx-auto md:border-x md:border-surface-variant md:shadow-2xl relative">
<!-- TopAppBar Semantic Shell (Hidden Nav, Transactional Context) -->
<header class="bg-surface shadow-sm docked full-width top-0 sticky z-50 flex items-center justify-between px-margin-mobile py-md w-full">
<button aria-label="Go back" class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Track Order</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 flex flex-col relative pb-32">
<!-- Map Area -->
<div class="relative h-[309px] min-h-[300px] w-full bg-surface-container-high overflow-hidden" data-location="City Streets" style="">
<img class="w-full h-full object-cover" data-alt="A stylized, light-themed map visualization typical of a premium delivery app. Soft, pastel street blocks with clean white roads. The overall tone is bright, minimalist, and easy to read, reflecting a high-end local commerce platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCvSyeO65GhgriGkqdjQ0mIJfyOtSGTXE51fDICgqYlyQxtCYzC09SxgIeOA7lfOLv8Y86-hLcQ2WSCI_W0l20TcpAuKPilVhrdr0yHqgU0nCVWwaVQtizrNz0N_l7AxE4wCPg2RTTIa7WpLsDT-l0Xlbn_NOlDUjFRFRMzgpLMYEmBo6e8WlZ_vTKOq3CnQ92RsEbNbdRNdTGHjmbNAg8w7gnsGB72Bm6Xuo7FiporNI0Ibh9MBWBp"/>
<!-- Map Gradient Overlay -->
<div class="absolute inset-0 map-gradient pointer-events-none"></div>
<!-- Route Line (SVG placeholder for effect) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveaspectratio="none" viewbox="0 0 400 300">
<path class="opacity-70" d="M 100 250 Q 150 200 200 150 T 300 50" fill="none" stroke="#10b981" stroke-dasharray="8,8" stroke-width="4"></path>
</svg>
<!-- Delivery Partner Pin -->
<div class="absolute top-[120px] left-[180px] transform -translate-x-1/2 -translate-y-1/2 z-10 drop-shadow-md">
<div class="bg-surface rounded-full p-2 shadow-[0px_8px_24px_rgba(0,0,0,0.12)] border border-surface-variant">
<span class="material-symbols-outlined text-primary text-xl" style="font-variation-settings: 'FILL' 1;">two_wheeler</span>
</div>
</div>
<!-- Customer Location Pin -->
<div class="absolute top-[250px] left-[100px] transform -translate-x-1/2 -translate-y-full z-10">
<div class="relative flex items-center justify-center pulse-ring w-12 h-12">
<div class="bg-primary rounded-full p-2 shadow-lg z-20 relative">
<span class="material-symbols-outlined text-on-primary text-lg" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
</div>
</div>
<!-- Arriving ETA Overlay -->
<div class="absolute top-margin-mobile left-1/2 transform -translate-x-1/2 bg-surface rounded-full px-lg py-sm shadow-[0px_4px_20px_rgba(0,0,0,0.08)] flex items-center gap-2 border border-surface-variant/50">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span class="font-label-lg text-label-lg text-on-surface">Arriving in <span class="text-primary font-bold">12 min</span></span>
</div>
</div>
<!-- Content Canvas -->
<div class="px-margin-mobile flex flex-col gap-lg -mt-xl relative z-20">
<!-- Delivery Partner Card -->
<div class="bg-surface rounded-lg p-md shadow-[0px_4px_20px_rgba(0,0,0,0.04)] border border-surface-container flex items-center gap-md">
<div class="relative w-14 h-14 rounded-full overflow-hidden shrink-0 border-2 border-surface-container">
<img class="w-full h-full object-cover" data-alt="A portrait of a friendly delivery driver wearing a clean, modern green uniform. Natural, soft lighting with a subtle smile. High-quality lifestyle photography style, conveying reliability and premium service." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBZDZjko1WrEwOAc_bEC8SA0depNeq2AtOjBeWvWwPby9qVsuEmQZiFdjU1ntmF7TBjTmjFQHNUZg8J4jtxrvNitmHI1X3XKOkkq3ionXpuuYj8I9Hj4qPiVTov5tsUU0kETfvif4b5CCqNbiFqCOaivHOABaU0uZtbclXGxo__VxATIK09V_zXyhmYd2RpV9gHoMsuwdERLT1tbo0nlIg10VFDE619AVDlDQHTTJ2LmoPNmr4qwDjh"/>
</div>
<div class="flex-1">
<h3 class="font-label-lg text-label-lg text-on-surface">Rahul K.</h3>
<div class="flex items-center gap-1 mt-xs">
<span class="material-symbols-outlined text-secondary-container text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-body-md text-body-md text-on-surface-variant font-medium">4.9</span>
<span class="text-outline-variant px-1">•</span>
<span class="font-body-md text-body-md text-on-surface-variant">Pulsar 150</span>
</div>
</div>
<div class="flex gap-2 shrink-0">
<button aria-label="Call driver" class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">call</span>
</button>
<button aria-label="Message driver" class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">chat</span>
</button>
</div>
</div>
<!-- Order Timeline -->
<div class="bg-surface rounded-lg p-lg shadow-[0px_4px_20px_rgba(0,0,0,0.04)] border border-surface-container">
<h2 class="font-label-lg text-label-lg text-on-surface mb-md">Order Status</h2>
<div class="relative pl-6">
<!-- Vertical Line connecting nodes -->
<div class="absolute left-[11px] top-2 bottom-6 w-0.5 bg-surface-container-highest"></div>
<!-- Active part of line -->
<div class="absolute left-[11px] top-2 h-[50%] w-0.5 bg-primary"></div>
<!-- Step 1: Confirmed -->
<div class="relative flex gap-md mb-lg">
<div class="absolute -left-6 top-0.5 w-6 h-6 flex items-center justify-center bg-surface">
<div class="w-3 h-3 rounded-full bg-primary ring-4 ring-primary/20"></div>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">10:45 AM</p>
<p class="font-body-lg text-body-lg text-on-surface font-medium">Order Confirmed</p>
</div>
</div>
<!-- Step 2: Preparing -->
<div class="relative flex gap-md mb-lg">
<div class="absolute -left-6 top-0.5 w-6 h-6 flex items-center justify-center bg-surface">
<div class="w-3 h-3 rounded-full bg-primary ring-4 ring-primary/20"></div>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">10:52 AM</p>
<p class="font-body-lg text-body-lg text-on-surface font-medium">Preparing Order</p>
</div>
</div>
<!-- Step 3: On the Way (Active) -->
<div class="relative flex gap-md mb-lg">
<div class="absolute -left-6 top-0.5 w-6 h-6 flex items-center justify-center bg-surface">
<div class="w-4 h-4 rounded-full bg-primary border-2 border-surface shadow-[0_0_0_2px_rgba(16,185,129,1)]"></div>
</div>
<div>
<p class="font-label-sm text-label-sm text-primary font-bold">Now</p>
<p class="font-headline-md text-headline-md text-on-surface">On the Way</p>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Rahul is near 5th Avenue.</p>
</div>
</div>
<!-- Step 4: Delivered (Upcoming) -->
<div class="relative flex gap-md">
<div class="absolute -left-6 top-0.5 w-6 h-6 flex items-center justify-center bg-surface">
<div class="w-3 h-3 rounded-full bg-surface-container-highest"></div>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant opacity-50">Est. 11:15 AM</p>
<p class="font-body-lg text-body-lg text-on-surface-variant opacity-50">Delivered</p>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- Sticky Mini Order Summary (Transactional Action Area) -->
<div class="fixed bottom-0 w-full md:max-w-[428px] bg-surface rounded-t-lg shadow-[0px_-8px_24px_rgba(0,0,0,0.06)] border-t border-surface-container z-50 p-margin-mobile pb-safe">
<div class="flex items-center justify-between mb-md">
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Order #LD-9482</p>
<p class="font-body-lg text-body-lg text-on-surface font-semibold">3 Items</p>
</div>
<button class="font-label-lg text-label-lg text-primary hover:opacity-80 transition-opacity">
                View Details
            </button>
</div>
<button class="w-full bg-surface-container-low text-on-surface font-label-lg text-label-lg py-3 rounded-full border border-outline-variant hover:bg-surface-container transition-colors active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm">support_agent</span>
             Need Help?
        </button>
</div>
</body></html>
