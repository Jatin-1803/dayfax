<style>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Confetti Container -->
<div class="absolute inset-0 pointer-events-none z-0" id="confetti-container"></div>
<main class="w-full max-w-md px-gutter z-10 flex flex-col items-center">
<!-- Success Icon -->
<div class="w-24 h-24 bg-primary-container rounded-full flex items-center justify-center mb-xl shadow-lg relative">
<div class="absolute inset-0 bg-primary-container rounded-full animate-ping opacity-25"></div>
<span class="material-symbols-outlined text-[48px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs text-center">Delivery Completed</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl text-center">Great job! The package was delivered successfully.</p>
<!-- Details Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-lg border border-outline-variant mb-xl">
<h2 class="font-label-lg text-label-lg text-on-surface-variant mb-md uppercase tracking-wider">Delivery Details</h2>
<div class="space-y-md">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Order ID</span>
<span class="font-label-lg text-label-lg text-on-surface">#ORD-9482-XK</span>
</div>
<div class="h-[1px] bg-outline-variant opacity-50 w-full"></div>
<div class="flex justify-between items-start">
<span class="font-body-md text-body-md text-on-surface-variant">Customer</span>
<div class="text-right">
<span class="font-label-lg text-label-lg text-on-surface block">Sarah Jenkins</span>
<span class="font-label-md text-label-md text-on-surface-variant">Signature Required: Yes</span>
</div>
</div>
<div class="h-[1px] bg-outline-variant opacity-50 w-full"></div>
<div class="flex justify-between items-start">
<span class="font-body-md text-body-md text-on-surface-variant">Address</span>
<span class="font-label-lg text-label-lg text-on-surface text-right w-2/3">4200 Riverfront Pkwy, Apt 304, Seattle, WA 98109</span>
</div>
<div class="h-[1px] bg-outline-variant opacity-50 w-full"></div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Delivered At</span>
<span class="font-label-lg text-label-lg text-on-surface">14:23 PM Today</span>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full space-y-md mt-auto mb-lg">
<button class="w-full h-[56px] bg-primary text-on-primary font-headline-sm text-headline-sm rounded-lg flex items-center justify-center hover:bg-on-primary-fixed-variant transition-colors active:scale-95 duration-100 shadow-md">
                View Next Delivery
            </button>
<button class="w-full h-[56px] bg-surface text-primary border border-outline-variant font-headline-sm text-headline-sm rounded-lg flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-95 duration-100">
                Back to Deliveries
            </button>
</div>
</main>
<script>
        // Simple confetti effect for success screen
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#006c49', '#10b981', '#6ffbbe', '#4edea3']; // Brand colors
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Randomize properties
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const animDuration = Math.random() * 3 + 2;
                const delay = Math.random() * 2;
                
                confetti.style.backgroundColor = color;
                confetti.style.left = `${left}vw`;
                confetti.style.top = `-10px`;
                confetti.style.animation = `fall ${animDuration}s linear ${delay}s forwards`;
                
                // Random shapes
                if (Math.random() > 0.5) {
                    confetti.style.borderRadius = '50%';
                }
                
                container.appendChild(confetti);
            }
        });
    </script>
