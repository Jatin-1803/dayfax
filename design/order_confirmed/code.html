<style>
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }
        .draw-check {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: draw 0.8s ease-out forwards 0.2s;
        }
        @keyframes draw {

<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col font-body-md">
<!-- Top Navigation suppressed for transactional/success screen as per rule -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Decorative Ambient Blur -->
<div class="absolute top-1/4 left-1/4 w-[300px] h-[300px] bg-primary/10 rounded-full blur-[80px] pointer-events-none"></div>
<div class="absolute bottom-1/4 right-1/4 w-[250px] h-[250px] bg-secondary-container/10 rounded-full blur-[60px] pointer-events-none"></div>
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)] p-xl text-center relative z-10 flex flex-col items-center">
<!-- Success Animation Icon -->
<div class="relative w-32 h-32 mb-lg flex items-center justify-center">
<div class="absolute inset-0 bg-primary/10 rounded-full pulse-ring"></div>
<div class="absolute inset-4 bg-primary/20 rounded-full pulse-ring" style="animation-delay: 0.2s;"></div>
<div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center z-10 shadow-[0px_8px_24px_rgba(16,185,129,0.25)]">
<svg class="w-8 h-8 text-on-primary" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24">
<path class="draw-check" d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Headline -->
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-xs tracking-tight">Order Confirmed!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl">Your order has been placed successfully.</p>
<!-- Order Details Card -->
<div class="w-full bg-surface-container-low rounded-lg p-md mb-xl flex flex-col gap-sm text-left">
<div class="flex justify-between items-center pb-sm border-b border-surface-variant">
<span class="font-label-lg text-label-lg text-on-surface-variant">Order Number</span>
<span class="font-headline-md text-headline-md text-on-surface">#LD123456</span>
</div>
<div class="flex justify-between items-center py-xs">
<span class="font-label-lg text-label-lg text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">schedule</span>

                    </span>
<span class="font-body-lg text-body-lg text-on-surface font-semibold">15-20 mins</span>
</div>
<div class="flex justify-between items-center py-xs">
<span class="font-label-lg text-label-lg text-on-surface-variant">Total Paid</span>
<span class="font-body-lg text-body-lg text-on-surface font-semibold">₹487</span>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-md">
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-label-lg text-label-lg py-4 rounded-full shadow-[0px_8px_24px_rgba(16,185,129,0.15)] transition-all active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">location_on</span>
