<body class="bg-background text-on-background h-full flex flex-col items-center justify-center font-body-md antialiased md:bg-surface-container-lowest">
<!-- Main Container -->
<main class="w-full max-w-md p-lg flex flex-col flex-1 md:flex-none md:rounded-xl md:shadow-lg md:bg-surface md:border md:border-outline-variant md:my-auto md:min-h-[600px] justify-center">
<!-- Logo & Branding -->
<div class="flex flex-col items-center justify-center mb-xl mt-xl md:mt-0">
<div class="w-24 h-24 bg-primary-container rounded-full flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-on-primary-container" data-icon="local_shipping" style="font-size: 48px;">local_shipping</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary md:font-headline-lg md:text-headline-lg text-center">Delivery Partner</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-sm">Login to manage your deliveries</p>
</div>
<!-- Form Area -->
<div class="flex-1 flex flex-col justify-center w-full max-w-sm mx-auto gap-lg">
<!-- Input Group -->
<div class="flex flex-col gap-xs w-full">
<label class="font-label-lg text-label-lg text-on-surface" for="phone">Phone Number</label>
<div class="flex border border-outline rounded-lg focus-within:border-primary focus-within:ring-1 focus-within:ring-primary overflow-hidden h-[56px] bg-surface">
<button class="flex items-center gap-xs px-md bg-surface-container-low border-r border-outline text-on-surface hover:bg-surface-container transition-colors h-full" type="button">
<span class="font-body-md text-body-md">+1</span>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="arrow_drop_down" style="font-size: 20px;">arrow_drop_down</span>
</button>
<input class="flex-1 bg-transparent border-none focus:ring-0 px-md font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant h-full w-full outline-none" id="phone" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-[56px] bg-primary text-on-primary font-headline-sm text-headline-sm rounded-lg hover:bg-on-primary-fixed-variant transition-colors active:scale-[0.98] duration-100 flex items-center justify-center shadow-md mt-md">
                Continue
            </button>
<!-- Divider -->
<div class="flex items-center gap-md my-md">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-md text-label-md text-on-surface-variant uppercase">or</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Secondary Action -->
<button class="w-full h-[56px] bg-surface-container-low text-on-surface font-headline-sm text-headline-sm rounded-lg hover:bg-surface-container transition-colors border border-outline-variant flex items-center justify-center">
                Login with Email
            </button>
</div>
<!-- Footer / Legal -->
<div class="mt-auto mb-lg text-center px-lg md:mb-0 md:mt-xl">
<p class="font-label-md text-label-md text-on-surface-variant font-normal">
                By continuing, you agree to our <a class="text-primary underline" href="#">Terms of Service</a> and <a class="text-primary underline" href="#">Privacy Policy</a>.
            </p>
