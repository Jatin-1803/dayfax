<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>OTP Verification</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed": "#131b2e",
                    "surface-dim": "#d8dadc",
                    "surface-container-low": "#f2f4f6",
                    "on-secondary-container": "#5c647a",
                    "primary": "#006c49",
                    "inverse-on-surface": "#eff1f3",
                    "secondary-container": "#dae2fd",
                    "primary-fixed": "#6ffbbe",
                    "on-error": "#ffffff",
                    "secondary-fixed-dim": "#bec6e0",
                    "on-primary-fixed": "#002113",
                    "secondary-fixed": "#dae2fd",
                    "surface": "#f7f9fb",
                    "inverse-primary": "#4edea3",
                    "on-primary-container": "#00422b",
                    "secondary": "#565e74",
                    "outline": "#6c7a71",
                    "on-tertiary": "#ffffff",
                    "error-container": "#ffdad6",
                    "surface-bright": "#f7f9fb",
                    "error": "#ba1a1a",
                    "tertiary": "#515f74",
                    "tertiary-fixed-dim": "#b9c7e0",
                    "on-tertiary-fixed": "#0d1c2f",
                    "background": "#f7f9fb",
                    "on-primary": "#ffffff",
                    "tertiary-container": "#95a4bb",
                    "on-error-container": "#93000a",
                    "surface-container-high": "#e6e8ea",
                    "on-primary-fixed-variant": "#005236",
                    "on-surface": "#191c1e",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary": "#ffffff",
                    "on-tertiary-container": "#2c3a4e",
                    "on-surface-variant": "#3c4a42",
                    "on-secondary-fixed-variant": "#3f465c",
                    "outline-variant": "#bbcabf",
                    "primary-container": "#10b981",
                    "surface-container": "#eceef0",
                    "surface-tint": "#006c49",
                    "surface-container-highest": "#e0e3e5",
                    "on-background": "#191c1e",
                    "surface-variant": "#e0e3e5",
                    "tertiary-fixed": "#d5e3fd",
                    "on-tertiary-fixed-variant": "#3a485c",
                    "inverse-surface": "#2d3133",
                    "primary-fixed-dim": "#4edea3"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "lg": "24px",
                    "xs": "4px",
                    "touch-target": "48px",
                    "xl": "32px",
                    "sm": "8px",
                    "base": "4px",
                    "margin-mobile": "16px",
                    "gutter": "16px",
                    "md": "16px"
            },
            "fontFamily": {
                    "label-md": ["Plus Jakarta Sans"],
                    "headline-lg-mobile": ["Plus Jakarta Sans"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "headline-sm": ["Plus Jakarta Sans"],
                    "label-lg": ["Plus Jakarta Sans"],
                    "body-lg": ["Plus Jakarta Sans"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "body-md": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
                    "headline-md": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style>
        /* Custom input styles for OTP fields */
        .otp-input:focus {
            outline: none;
            border-color: #006c49; /* primary */
            box-shadow: 0 0 0 2px rgba(0, 108, 73, 0.2);
        }
        /* Auto-verification loader */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #006c49;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface h-full flex flex-col font-body-md text-on-surface antialiased selection:bg-primary selection:text-on-primary">
<!-- Top App Bar (Modified for linear flow - back button only) -->
<header class="w-full top-0 sticky bg-surface z-10">
<div class="flex justify-between items-center h-touch-target px-md w-full">
<button aria-label="Go back" class="h-touch-target w-touch-target flex items-center justify-center -ml-4 text-on-surface hover:bg-surface-container-high rounded-full transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex-1"></div>
<!-- TopAppBar is technically suppressed as per instructions for linear/transactional screens, 
                 but a minimal back affordance is standard for this flow to avoid trapping the user. -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-md pt-lg pb-[80px] max-w-md mx-auto w-full">
<!-- Header Section -->
<div class="mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm">Verify your number</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                We've sent a 4-digit code to <br/>
<span class="font-label-lg text-label-lg text-on-surface">+1 (555) 123-4567</span>
</p>
<button aria-label="Change phone number" class="mt-sm font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant active:scale-95 transition-transform duration-100 uppercase">
                Change number
            </button>
</div>
<!-- OTP Input Form -->
<form class="flex flex-col flex-1" id="otp-form" onsubmit="event.preventDefault(); document.getElementById('verify-btn').click();">
<!-- OTP Fields Container -->
<div class="flex justify-between items-center mb-xl w-full max-w-[280px] mx-auto">
<input aria-label="Digit 1" autofocus="" class="otp-input w-16 h-16 text-center font-headline-lg-mobile text-headline-lg-mobile bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface focus:ring-0 focus:border-primary transition-all shadow-sm" id="otp-1" maxlength="1" pattern="[0-9]" type="tel"/>
<input aria-label="Digit 2" class="otp-input w-16 h-16 text-center font-headline-lg-mobile text-headline-lg-mobile bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface focus:ring-0 focus:border-primary transition-all shadow-sm" disabled="" id="otp-2" maxlength="1" pattern="[0-9]" type="tel"/>
<input aria-label="Digit 3" class="otp-input w-16 h-16 text-center font-headline-lg-mobile text-headline-lg-mobile bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface focus:ring-0 focus:border-primary transition-all shadow-sm" disabled="" id="otp-3" maxlength="1" pattern="[0-9]" type="tel"/>
<input aria-label="Digit 4" class="otp-input w-16 h-16 text-center font-headline-lg-mobile text-headline-lg-mobile bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface focus:ring-0 focus:border-primary transition-all shadow-sm" disabled="" id="otp-4" maxlength="1" pattern="[0-9]" type="tel"/>
</div>
<!-- Auto Verification State (Hidden by default) -->
<div class="hidden flex flex-col items-center justify-center mb-xl h-[48px]" id="auto-verify-state">
<div class="loader mb-2"></div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Auto-verifying...</p>
</div>
<!-- Resend Section -->
<div class="text-center mb-auto" id="resend-section">
<p class="font-body-md text-body-md text-on-surface-variant mb-xs">Didn't receive the code?</p>
<button aria-label="Resend OTP" class="font-label-lg text-label-lg text-primary hover:text-on-primary-fixed-variant active:scale-95 transition-transform duration-100 flex items-center justify-center mx-auto" type="button">
<span class="material-symbols-outlined mr-1 text-[18px]" data-icon="refresh">refresh</span>
                    Resend OTP <span class="ml-1 text-on-surface-variant text-label-md" id="timer">(0:30)</span>
</button>
</div>
<!-- Primary Action Button (Fixed near bottom) -->
<div class="mt-xl pb-safe">
<button class="w-full min-h-[56px] bg-primary text-on-primary font-headline-sm text-headline-sm rounded-xl shadow-md hover:bg-on-primary-fixed-variant active:scale-95 transition-all duration-200 flex items-center justify-center opacity-50 cursor-not-allowed" disabled="" id="verify-btn" type="button">
                    Verify
                </button>
</div>
</form>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const verifyBtn = document.getElementById('verify-btn');
            const autoVerifyState = document.getElementById('auto-verify-state');
            const resendSection = document.getElementById('resend-section');

            // Handle OTP Input Logic
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Allow only numbers
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');

                    if (e.target.value.length === 1) {
                        // Move to next input
                        if (index < inputs.length - 1) {
                            inputs[index + 1].disabled = false;
                            inputs[index + 1].focus();
                        }
                    }

                    checkAllFilled();
                });

                input.addEventListener('keydown', (e) => {
                    // Handle backspace
                    if (e.key === 'Backspace' && e.target.value === '') {
                        if (index > 0) {
                            inputs[index - 1].focus();
                            inputs[index].disabled = true;
                        }
                    }
                });
            });

            function checkAllFilled() {
                const isAllFilled = Array.from(inputs).every(input => input.value.length === 1);
                
                if (isAllFilled) {
                    verifyBtn.disabled = false;
                    verifyBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    
                    // Simulate auto-verification
                    simulateAutoVerify();
                } else {
                    verifyBtn.disabled = true;
                    verifyBtn.classList.add('opacity-50', 'cursor-not-allowed');
                }
            }

            function simulateAutoVerify() {
                // Hide inputs, show loader
                resendSection.classList.add('hidden');
                autoVerifyState.classList.remove('hidden');
                autoVerifyState.classList.add('flex');
                
                // Dim verify button slightly to indicate process
                verifyBtn.classList.add('opacity-80');
                verifyBtn.innerText = "Verifying...";

                // Simulate network request
                setTimeout(() => {
                    verifyBtn.classList.remove('opacity-80');
                    verifyBtn.innerText = "Success";
                    verifyBtn.classList.add('bg-primary-container', 'text-on-primary-container');
                    
                    autoVerifyState.innerHTML = '<span class="material-symbols-outlined text-primary text-3xl mb-2" data-icon="check_circle">check_circle</span><p class="font-label-md text-label-md text-primary uppercase tracking-widest">Verified</p>';
                }, 2000);
            }
        });
    </script>
</body></html>
