</div>
</div>

<!-- Main Content Canvas -->

<!-- Greeting -->
<section class="mt-sm">

<p class="font-body-md text-body-md text-on-surface-variant">You have deliveries waiting.</p>
</section>
<!-- Today's Delivery Card -->
<section>
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-sm">Today's Delivery</h2>
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-lg flex flex-col gap-md shadow-[0px_4px_20px_rgba(15,23,42,0.04)]">
<!-- Header -->
<div class="flex justify-between items-start">
<div>
<span class="inline-block bg-primary-container/20 text-on-primary-container px-2 py-1 rounded font-label-md text-label-md mb-2">ON THE WAY</span>
<h3 class="font-headline-sm text-headline-sm text-on-surface">Order #1024</h3>
</div>
<div class="text-right">
<span class="font-headline-md text-headline-md text-primary">15 min</span>
<p class="font-body-md text-body-md text-on-surface-variant">2.4 km</p>
</div>
</div>
<!-- Customer Details -->
<div class="flex flex-col gap-sm border-t border-outline-variant pt-md">
<div class="flex items-center gap-sm text-on-surface">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-lg text-label-lg">Amit Sharma</span>
</div>
<div class="flex items-start gap-sm text-on-surface-variant">
<span class="material-symbols-outlined text-outline mt-1" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="font-body-md text-body-md">Sherpur, Sadabad</span>
</div>
</div>
<!-- Map Placeholder -->
<div class="w-full h-32 rounded-lg bg-surface-container overflow-hidden border border-outline-variant relative">
<div class="w-full h-full bg-cover bg-center" data-alt="A stylized, flat-vector mobile map interface showing a delivery route. A bright green line traces a path through a simplistic grid of light gray streets on an off-white background. A blue dot indicates the current driver location, and a red destination pin marks the drop-off point. The aesthetic is clean, high-contrast, and focused purely on navigation utility." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBKLPHcgrjdi2z3IV2tSkNkxE25taL9SAXDGLMl0lTFXjhppkPfX4j7giS-8eMVBGIR1XlEc3-5SLwEnO6G8BdqbMqJebJtcbYOYRpeusOzEuX43s8fnJ0sQ1sF_GoO8DqLk9OU-tgMoMJwNNBZscyRYjMXGMY2a1uPbnp4AjD_Kv5t8gt7zduhOjadT01cRq91c7VDWW5L8-3MCWDUJG6l5EwXRBdo-CPq07-9bd9OMyfDUE5onpH3')"></div>
</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">visibility</span>

<button class="w-full h-[56px] border border-outline text-on-surface rounded-lg font-headline-sm text-headline-sm flex items-center justify-center gap-2 active:scale-95 transition-transform duration-100 bg-surface">

<!-- Stats Footer -->
<section class="grid grid-cols-3 gap-sm mt-auto pb-4">

<span class="font-headline-md text-headline-md text-on-surface">4</span>
</div>
<div class="bg-surface-container rounded-lg p-sm flex flex-col items-center border border-outline-variant">
<span class="font-label-md text-label-md text-on-surface-variant">Completed</span>
<span class="font-headline-md text-headline-md text-primary">3</span>
</div>
<div class="bg-surface-container rounded-lg p-sm flex flex-col items-center border border-outline-variant">
<span class="font-label-md text-label-md text-on-surface-variant">Pending</span>
<span class="font-headline-md text-headline-md text-error">1</span>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">history</span>
<span class="font-label-md text-label-md mt-1">History</span>
</button>
<button class="flex flex-col items-center justify-center text-on-secondary-container hover:bg-surface-container active:scale-90 transition-transform duration-200 px-4 py-1 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-md text-label-md mt-1">Profile</span>
</button>

<script>
        // Simple toggle interaction for Online status
        const toggle = document.getElementById('onlineToggle');
        let isOnline = true;
        
        toggle.addEventListener('click', () => {
            isOnline = !isOnline;
            const knob = toggle.querySelector('div');
            if(isOnline) {
                toggle.classList.remove('bg-surface-variant');
                toggle.classList.add('bg-primary-container');
                knob.classList.remove('left-1');
                knob.classList.add('right-1');
            } else {
                toggle.classList.add('bg-surface-variant');
                toggle.classList.remove('bg-primary-container');
                knob.classList.remove('right-1');
                knob.classList.add('left-1');
            }
        });
    </script>
