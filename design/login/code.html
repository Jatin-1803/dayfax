<body class="bg-surface-container-lowest min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Decoration (Soft Ambient Rings) -->
<div class="absolute top-[-100px] left-[-100px] w-96 h-96 bg-primary-container opacity-5 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-[-150px] right-[-150px] w-[500px] h-[500px] bg-secondary-container opacity-5 rounded-full blur-3xl pointer-events-none"></div>
<main class="w-full max-w-md px-margin-mobile md:px-margin-desktop py-xl z-10 flex flex-col h-full md:h-auto md:bg-surface md:shadow-[0px_4px_20px_rgba(0,0,0,0.04)] md:rounded-xl">
<!-- Header / Logo -->
<div class="flex items-center mb-xl">
<span class="material-symbols-outlined text-primary text-4xl mr-sm" data-weight="fill" style="font-variation-settings: 'FILL' 1;">location_on</span>
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tight">LocalDash</h1>
</div>
<!-- Headline -->
<div class="mb-xl">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-sm">Get your essentials delivered fast</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Enter your mobile number to get started.</p>
</div>
<!-- Form -->
<form class="flex-grow flex flex-col justify-between" onsubmit="event.preventDefault(); showOTPState();">
<!-- Input Area -->
<div class="mb-xl transition-all duration-300" id="phone-input-group">
<div class="flex items-center bg-[#F3F4F6] rounded-full p-sm focus-within:ring-2 focus-within:ring-primary-container focus-within:bg-white transition-all shadow-sm">
<!-- Country Code Dropdown (Simulated) -->
<div class="flex items-center pl-sm pr-xs py-sm border-r border-outline-variant/30 cursor-pointer text-on-surface font-body-lg text-body-lg">
<span>+91</span>
<span class="material-symbols-outlined text-on-surface-variant ml-xs text-sm">expand_more</span>
</div>
<!-- Phone Input -->
<input class="flex-grow bg-transparent border-none focus:ring-0 text-on-surface font-body-lg text-body-lg px-md w-full placeholder:text-outline" id="phone-number" pattern="[0-9]{10}" placeholder="00000 00000" required="" type="tel"/>
</div>
</div>
<!-- OTP Area (Hidden initially) -->
<div class="mb-xl hidden opacity-0 transition-all duration-300 transform translate-y-4" id="otp-input-group">
<label class="block font-label-lg text-label-lg text-on-surface mb-md">Enter 4-digit code</label>
<div class="flex justify-between gap-sm">
<input class="w-14 h-14 text-center font-headline-lg text-headline-lg text-on-surface bg-[#F3F4F6] border-none rounded-DEFAULT focus:ring-2 focus:ring-primary-container focus:bg-white shadow-sm transition-all otp-input" maxlength="1" type="text"/>
<input class="w-14 h-14 text-center font-headline-lg text-headline-lg text-on-surface bg-[#F3F4F6] border-none rounded-DEFAULT focus:ring-2 focus:ring-primary-container focus:bg-white shadow-sm transition-all otp-input" maxlength="1" type="text"/>
<input class="w-14 h-14 text-center font-headline-lg text-headline-lg text-on-surface bg-[#F3F4F6] border-none rounded-DEFAULT focus:ring-2 focus:ring-primary-container focus:bg-white shadow-sm transition-all otp-input" maxlength="1" type="text"/>
<input class="w-14 h-14 text-center font-headline-lg text-headline-lg text-on-surface bg-[#F3F4F6] border-none rounded-DEFAULT focus:ring-2 focus:ring-primary-container focus:bg-white shadow-sm transition-all otp-input" maxlength="1" type="text"/>
</div>
<div class="mt-md text-center">
<button class="font-label-lg text-label-lg text-primary hover:text-primary-container transition-colors" type="button">Resend Code</button>
</div>
</div>
<!-- Action Area -->
<div class="mt-auto md:mt-xl flex flex-col gap-md">
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-md rounded-full shadow-[0px_8px_24px_rgba(16,185,129,0.15)] hover:opacity-90 active:scale-95 transition-all duration-200 flex items-center justify-center" id="main-action-btn" type="submit">
<span id="btn-text">Continue</span>
<span class="material-symbols-outlined ml-sm hidden" id="btn-icon">arrow_forward</span>
</button>
<p class="text-center font-body-md text-body-md text-on-surface-variant px-md mt-sm">
                    By continuing, you agree to our

                </p>

<script>
        // Simple Interaction Logic
        let state = 'phone'; // 'phone' or 'otp'
        
        const phoneGroup = document.getElementById('phone-input-group');
        const otpGroup = document.getElementById('otp-input-group');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const otpInputs = document.querySelectorAll('.otp-input');

        function showOTPState() {
            if (state === 'phone') {
                // Transition to OTP
                phoneGroup.classList.add('opacity-0', 'pointer-events-none');
                
                setTimeout(() => {
                    phoneGroup.classList.add('hidden');
                    otpGroup.classList.remove('hidden');
                    
                    // Trigger reflow for animation
                    void otpGroup.offsetWidth;
                    
                    otpGroup.classList.remove('opacity-0', 'translate-y-4');
                    
                    btnText.innerText = 'Verify & Login';
                    btnIcon.classList.remove('hidden');
                    
                    state = 'otp';
                    otpInputs[0].focus();
                }, 300);
            } else {
                // Submit OTP (Mock)
                const btn = document.getElementById('main-action-btn');
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
                setTimeout(() => {
                    btn.innerHTML = '<span class="material-symbols-outlined text-on-primary">check</span>';
                    btn.classList.replace('bg-primary', 'bg-primary-container');
                }, 1000);
            }
        }

        // OTP Input Auto-advance
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });
    </script>
