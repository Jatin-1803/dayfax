# DayFax hosts — does NOT touch the tatami vhost.
# dayfax.in         → marketing / legal site (+ /api proxy until DNS ready)
# backend.dayfax.in → Node API (PM2 :3010)
# admin.dayfax.in   → React admin SPA

# ---------- www → apex ----------
server {
    server_name www.dayfax.in;
    return 301 https://dayfax.in$request_uri;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dayfax.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dayfax.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ---------- Marketing site ----------
server {
    server_name dayfax.in;
    root /var/www/dayfax/website;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Keep API reachable on apex until backend.dayfax.in DNS + SSL are live
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3010/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /privacy {
        try_files /privacy.html =404;
    }

    location = /terms {
        try_files /terms.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dayfax.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dayfax.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ---------- API HTTP → HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name backend.dayfax.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- Admin HTTP → HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name admin.dayfax.in;
    root /var/www/dayfax/admin-dist;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- Apex HTTP → HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name dayfax.in www.dayfax.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
